<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root{
            font-size: 10px;
        }
        body{
            height: 100vh;
        }
        p{
            font-size: 5em;
            animation: lancamento 2s ease-in-out infinite;
        }
        @keyframes lancamento{
            0%{
              transform: translateY(50vh)rotate(-45deg);
            }

            100%{
                transform: translateY(-50vh)rotate(-45deg);
            }
        }
    </style>
</head>
<body>
    <p>🚀</p>
    
</body>
</html>
