<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
             display: flex;
             height: 100vh;
             flex-direction: column;
             justify-content: center;
             align-items: center;
        }
        .inputs{
             display: flex;
        }

    </style>
</head>
<body>

    <div class="container">

       <div class="form">

        <div class="inputs">
            <label for="min">minimo</label>
            <input type="number" id="min"></input>
        </div>

        <div class="inputs">
            <label for="max">maximo</label>
            <input type="number" id="max"></input>
        </div>

        </div> 

        <button id="sortear">Sortear</button>
        <h2 id="result">-</h2>
    </div>
    <script>
        btnsortear.addEventListener("click", ()=>{
            minimo=Number.parseFloat(min.value)
            maximo=Number.parseFloat(max.value)
            random= (Math.random()*(maximo-minimo))+minimo
            result.innerHTML=random;

        })
    </script>
    
</body>
</html>
